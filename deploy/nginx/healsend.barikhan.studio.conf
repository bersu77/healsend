server {
    listen 80;
    server_name healsend.barikhan.studio;

    client_max_body_size 50M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name healsend.barikhan.studio;

    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/healsend.barikhan.studio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/healsend.barikhan.studio/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/healsend.barikhan.studio/chain.pem;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://healsend-next-preview-app:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;

        proxy_redirect off;
    }
}
