<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Rating Badge</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f1f3f4;
    font-family: 'Inter', sans-serif;
    gap: 32px;
    flex-wrap: wrap;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    background: #fff;
    border-radius: 100px;
    border: 1px solid #dadce0;
    box-shadow: 0 1px 6px rgba(0,0,0,.12);
    padding: 8px 16px 8px 10px;
    gap: 10px;
    cursor: default;
    user-select: none;
    transition: box-shadow .15s ease, transform .15s ease;
  }

  .badge:hover {
    box-shadow: 0 3px 14px rgba(0,0,0,.16);
    transform: translateY(-1px);
  }

  .divider {
    width: 1px;
    height: 20px;
    background: #dadce0;
    flex-shrink: 0;
  }

  .right {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .rating {
    font-size: 16px;
    font-weight: 700;
    color: #202124;
    letter-spacing: -0.2px;
    line-height: 1;
  }

  .star-icon {
    width: 13px;
    height: 13px;
    flex-shrink: 0;
  }

  .google-text {
    font-size: 12px;
    font-weight: 500;
    color: #5f6368;
    line-height: 1;
  }

  .badge-dark {
    background: #202124;
    border-color: #3c4043;
    box-shadow: 0 1px 6px rgba(0,0,0,.4);
  }
  .badge-dark .divider     { background: #3c4043; }
  .badge-dark .rating      { color: #e8eaed; }
  .badge-dark .google-text { color: #9aa0a6; }
</style>
</head>
<body>

<!-- LIGHT -->
<div class="badge">
  <svg width="26" height="26" viewBox="0 0 533.5 544.3" xmlns="http://www.w3.org/2000/svg">
    <path d="M533.5 278.4c0-18.5-1.5-37.1-4.7-55.3H272.1v104.8h147c-6.1 33.8-25.7 63.7-54.4 82.7v68h87.7c51.5-47.4 81.1-117.4 81.1-200.2z" fill="#4285f4"/>
    <path d="M272.1 544.3c73.4 0 135.3-24.1 180.4-65.7l-87.7-68c-24.4 16.6-55.9 26-92.6 26-71 0-131.2-47.9-152.8-112.3H28.9v70.1c46.2 91.9 140.3 149.9 243.2 149.9z" fill="#34a853"/>
    <path d="M119.3 324.3c-11.4-33.8-11.4-70.4 0-104.2V150H28.9c-38.6 76.9-38.6 167.5 0 244.4l90.4-70.1z" fill="#fbbc04"/>
    <path d="M272.1 107.7c38.8-.6 76.3 14 104.4 40.8l77.7-77.7C405 24.6 339.7-.8 272.1 0 169.2 0 75.1 58 28.9 150l90.4 70.1c21.5-64.5 81.8-112.4 152.8-112.4z" fill="#ea4335"/>
  </svg>
  <div class="divider"></div>
  <div class="right">
    <span class="rating">4.9</span>
    <svg class="star-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" fill="#FBBC04"/>
    </svg>
    <span class="google-text">Google</span>
  </div>
</div>

<!-- DARK -->
<div class="badge badge-dark">
  <svg width="26" height="26" viewBox="0 0 533.5 544.3" xmlns="http://www.w3.org/2000/svg">
    <path d="M533.5 278.4c0-18.5-1.5-37.1-4.7-55.3H272.1v104.8h147c-6.1 33.8-25.7 63.7-54.4 82.7v68h87.7c51.5-47.4 81.1-117.4 81.1-200.2z" fill="#4285f4"/>
    <path d="M272.1 544.3c73.4 0 135.3-24.1 180.4-65.7l-87.7-68c-24.4 16.6-55.9 26-92.6 26-71 0-131.2-47.9-152.8-112.3H28.9v70.1c46.2 91.9 140.3 149.9 243.2 149.9z" fill="#34a853"/>
    <path d="M119.3 324.3c-11.4-33.8-11.4-70.4 0-104.2V150H28.9c-38.6 76.9-38.6 167.5 0 244.4l90.4-70.1z" fill="#fbbc04"/>
    <path d="M272.1 107.7c38.8-.6 76.3 14 104.4 40.8l77.7-77.7C405 24.6 339.7-.8 272.1 0 169.2 0 75.1 58 28.9 150l90.4 70.1c21.5-64.5 81.8-112.4 152.8-112.4z" fill="#ea4335"/>
  </svg>
  <div class="divider"></div>
  <div class="right">
    <span class="rating">4.9</span>
    <svg class="star-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" fill="#FBBC04"/>
    </svg>
    <span class="google-text">Google</span>
  </div>
</div>

</body>
</html>
