# Local development Postgres. Sync URL with env/local-docker.database.env
# Bootstrap: npm run db:bootstrap:docker
services:
  postgres:
    image: postgres:16-alpine
    container_name: healsend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: johndoe
      POSTGRES_PASSWORD: randompassword
    ports:
      # 5433 avoids clashing with another Postgres already bound to 5432 on the host
      - "5433:5432"
    volumes:
      - healsend-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U johndoe -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  healsend-postgres-data:
